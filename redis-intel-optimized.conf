# Redis configuration optimized for Intel x86-64
# redis-intel-optimized.conf

# Memory and persistence
save ""                          # Disable snapshotting for performance
appendonly no                    # Disable AOF for benchmark
maxmemory-policy noeviction      # Never evict keys

# Network optimizations
tcp-nodelay yes                  # Disable Nagle algorithm
tcp-keepalive 60                 # Keep connections alive
timeout 0                        # Never timeout clients

# Intel-specific optimizations
hz 10                           # Lower background task frequency
tcp-backlog 65535               # Larger connection queue

# I/O optimizations  
io-threads 4                    # Use multiple I/O threads (Redis 6+)
io-threads-do-reads yes         # Enable threaded reads

# Memory optimizations
hash-max-ziplist-entries 512    # Optimize hash encoding
hash-max-ziplist-value 64
list-max-ziplist-size -2        # Optimize list encoding
zset-max-ziplist-entries 128    # Optimize sorted set encoding
zset-max-ziplist-value 64

# Disable slow operations
slowlog-log-slower-than 10000
slowlog-max-len 128

# Optimize for single-threaded workload (if not using io-threads)
# lazyfree-lazy-eviction yes
# lazyfree-lazy-expire yes
# lazyfree-lazy-server-del yes

# Client output buffer limits (prevent memory bloat)
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Intel-specific TCP socket options (requires kernel support)
# These need to be set at OS level:
# echo 1 > /proc/sys/net/ipv4/tcp_low_latency
# echo 1 > /proc/sys/net/ipv4/tcp_fastopen